services:
  tavolamica-menu:
    build: .
    container_name: tavolamica-menu
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${TAVOLAMICA_BIND_ADDRESS:-127.0.0.1}:${TAVOLAMICA_BIND_PORT:-8107}:8097"
    volumes:
      - tavolamica-cache:/app/data/cache
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8097/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  tavolamica-cache:
